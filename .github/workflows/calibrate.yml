name: 每週自動校正需量模型

on:
  schedule:
    - cron: '0 2 * * 1'   # 每週一 10:00（台灣時間）
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests urllib3 gspread google-auth
      - name: 用最新實測重新擬合
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        shell: bash   # 含 pipefail：校正失敗時這一步會變紅
        run: |
          python calibrate.py 2>&1 | tee /tmp/cal.log
          tail -3 /tmp/cal.log | while read -r l; do echo "::notice::$l"; done
      # 模型檔含產生時間，所以每週都會有一次提交：順便讓 repo 保持活躍，避免 GitHub 停用每日 18:00 排程
      - name: 提交新模型（儀表板會自動重新部署）
        run: |
          if git diff --quiet model/demand_model.json; then echo "::notice::模型沒有變化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/demand_model.json
          git commit -m "自動校正需量模型（資料至 $(python -c 'import json;print(json.load(open("model/demand_model.json"))["trained_through"])')）"
          git push
