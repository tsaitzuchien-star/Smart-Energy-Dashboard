name: 抓取歷史氣象（模型校正用）

on:
  workflow_dispatch:
  push:
    branches: [claude/weather-history]
    paths: [tools/fetch_weather_history.py, .github/workflows/weather-history.yml]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: ERA5 2021-08 → now (temperature, humidity) for the AC savings baseline
        run: |
          mkdir -p /tmp/wx
          python - <<'PY'
          import requests, json, sys
          sys.path.insert(0, 'tools')
          from fetch_weather_history import LAT, LON
          u = ("https://archive-api.open-meteo.com/v1/archive?latitude=%s&longitude=%s&start_date=2021-08-01&end_date=2026-11-05"
               "&hourly=temperature_2m,relative_humidity_2m,shortwave_radiation&timezone=Asia%%2FTaipei" % (LAT, LON))
          r = requests.get(u, timeout=300); r.raise_for_status()
          json.dump(r.json(), open('/tmp/wx/era5_2021_2026.json', 'w'))
          print('ok', len(r.json()['hourly']['time']))
          PY
      - name: 結果推到 claude/weather-history-results 分支
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan wx-results
          git rm -rfq .
          cp /tmp/wx/* .
          git add -A
          git commit -qm "ERA5 hourly 2021-08 → 2026-11 (AC savings baseline)"
          git push -f origin HEAD:claude/weather-history-results
