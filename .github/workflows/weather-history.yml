name: 抓取歷史氣象（模型校正用）

on:
  workflow_dispatch:
  push:
    branches: [claude/weather-history]
    paths: [tools/fetch_weather_history.py, .github/workflows/weather-history.yml]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Recent weather (ERA5 archive 2025-04 → now, plus ECMWF analysis last 20 days)
        run: |
          mkdir -p /tmp/wx
          python - <<'PY'
          import requests, json, sys, datetime as dt
          sys.path.insert(0, 'tools')
          from fetch_weather_history import LAT, LON
          end = (dt.date.today()).isoformat()
          u = ("https://archive-api.open-meteo.com/v1/archive?latitude=%s&longitude=%s&start_date=2025-04-01&end_date=%s"
               "&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,shortwave_radiation&timezone=Asia%%2FTaipei" % (LAT, LON, end))
          r = requests.get(u, timeout=300); r.raise_for_status()
          json.dump(r.json(), open('/tmp/wx/era5_2025_now.json', 'w'))
          print('era5 ok', len(r.json()['hourly']['time']))
          for m in ['ecmwf_ifs025', 'best_match']:
              u = ("https://api.open-meteo.com/v1/forecast?latitude=%s&longitude=%s&past_days=20&forecast_days=1&models=%s"
                   "&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,shortwave_radiation&timezone=Asia%%2FTaipei" % (LAT, LON, m))
              r = requests.get(u, timeout=120); r.raise_for_status()
              json.dump(r.json(), open('/tmp/wx/recent_%s.json' % m, 'w'))
              print(m, 'ok', len(r.json()['hourly']['time']))
          PY
      - name: 結果推到 claude/weather-history-results 分支
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan wx-results
          git rm -rfq .
          cp /tmp/wx/* .
          git add -A
          git commit -qm "Recent weather for weather-normalized savings"
          git push -f origin HEAD:claude/weather-history-results
