name: 園區即時總覽（ctic-ems-dashboard）

# 監控電腦每 15 分鐘（:01/:16/:31/:46）把全園區度數寫進 Google 雲端「BMS自動匯出」，
# 這裡在之後幾分鐘整理成 live.json（園區彙總）與 rooms.json（各分路），放到本 repo 的 ems-live 分支給網站讀。
# GitHub 排程可能延後幾分鐘到幾十分鐘，網站上會顯示資料時間。
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ems-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests gspread google-auth
      - name: 整理 live.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python build_ems_live.py
      - name: 發布到 ems-live 分支
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q
          git checkout -q -b ems-live
          git add .
          git -c user.name="ems-live-bot" -c user.email="actions@users.noreply.github.com" commit -qm "live $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ems-live
