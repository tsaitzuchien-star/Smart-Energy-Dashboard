name: 研究資料：下載歷史氣象與行事曆（期刊用）

on:
  push:
    branches: [claude/research]
    paths: [.github/workflows/research-data.yml]

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載
        env:
          LAT: "23.936537"
          LON: "120.697917"
          START: "2026-06-01"
          END: "2026-11-03"
        run: |
          set -e
          mkdir -p out && cd out
          V=temperature_2m,relative_humidity_2m,cloud_cover,shortwave_radiation,precipitation
          P=$(echo $V | sed 's/,/_previous_day1,/g')_previous_day1
          curl -sf --retry 3 "https://previous-runs-api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&start_date=$START&end_date=$END&hourly=$P&timezone=Asia%2FTaipei&models=ecmwf_ifs" -o wx_forecast_prev_day1.json
          curl -sf --retry 3 "https://archive-api.open-meteo.com/v1/archive?latitude=$LAT&longitude=$LON&start_date=$START&end_date=$END&hourly=$V&timezone=Asia%2FTaipei" -o wx_observed_era5.json
          curl -sf --retry 3 "https://raw.githubusercontent.com/ruyut/TaiwanCalendar/master/data/2026.json" -o calendar_2026.json
          ls -la
      - name: 推到 claude/research-results（不進主程式）
        run: |
          cd out
          git init -q && git checkout -q -b r
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "研究資料 $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:claude/research-results
